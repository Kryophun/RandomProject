<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A clean, responsive browser-based Snake game."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23386641%22/><circle cx=%2244%22 cy=%2220%22 r=%226%22 fill=%22%23f6f0df%22/></svg>"
    />
    <title>Garden Snake</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">Garden Snake</p>
          <h1>Eat fruit. Keep growing.</h1>
        </div>
        <div class="score-card" aria-label="Current score">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
      </header>

      <section class="board-wrap" aria-label="Snake game board">
        <canvas id="game-board" width="600" height="600"></canvas>
        <div id="game-overlay" class="game-overlay">
          <p id="game-message">Use arrow keys or WASD to guide the snake.</p>
          <button id="primary-action" type="button">Start game</button>
        </div>
      </section>

      <p id="game-status" class="game-status" aria-live="polite">
        Ready to play
      </p>

      <section class="instructions" aria-label="How to play">
        <h2>How to play</h2>
        <p>
          Eat the fruit to grow. Avoid the walls and your own tail. Use the
          arrow keys or WASD to turn.
        </p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
